<style>
  :root {
    --bg:        #f6f7fb;
    --surface:   #ffffff;
    --border:    #e3e6ef;
    --text:      #1f2937;
    --muted:     #6b7280;
    --accent:    #1f3a5f;
    --accent-2:  #3b82f6;
    --good:      #16a34a;
    --warn:      #d97706;
    --bad:       #dc2626;
    --radius:    8px;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:      #0f1115;
      --surface: #1a1d24;
      --border:  #2a2e38;
      --text:    #e6e8ee;
      --muted:   #8b93a7;
      --accent:  #e6e8ee;
    }
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--text);
  }

  /* ─── topbar ─── */
  .topbar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 24px; background: var(--accent); color: #fff;
  }
  .topbar .brand { display: flex; align-items: baseline; gap: 10px; }
  .topbar .logo { font-size: 20px; }
  .topbar .title { font-weight: 600; }
  .topbar .ver { opacity: .6; font-size: 12px; }
  .topbar .user { font-size: 13px; display: flex; gap: 10px; align-items: center; }
  .topbar .role {
    padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600;
    background: rgba(255,255,255,.15);
  }
  .role-admin  { background: var(--good)  !important; }
  .role-editor { background: var(--accent-2) !important; }
  .role-viewer { background: var(--muted) !important; }

  /* ─── tabs ─── */
  .tabs {
    display: flex; gap: 2px; padding: 0 16px; background: var(--surface);
    border-bottom: 1px solid var(--border); overflow-x: auto;
    position: sticky; top: 0; z-index: 10;
  }
  .tab {
    background: transparent; color: var(--text);
    border: 0; border-bottom: 2px solid transparent;
    padding: 10px 14px; cursor: pointer; font-size: 14px; font-weight: 500;
  }
  .tab:hover { background: rgba(0,0,0,.03); }
  .tab.active { border-bottom-color: var(--accent-2); color: var(--accent-2); }
  .tab .count {
    font-size: 11px; margin-left: 4px; padding: 1px 6px;
    background: var(--border); color: var(--muted); border-radius: 999px;
  }

  main { max-width: 1300px; margin: 0 auto; padding: 20px 16px 80px; }
  .pane { display: none; }
  .pane.active { display: block; }

  h1 { margin: 8px 0 4px; font-size: 22px; }
  .lead { color: var(--muted); max-width: 70ch; }

  /* ─── cards (home) ─── */
  .cards {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px; margin: 20px 0;
  }
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px; text-align: center;
  }
  .card .n { font-size: 28px; font-weight: 700; color: var(--accent-2); }
  .card .l { font-size: 12px; color: var(--muted); margin-top: 4px; letter-spacing: .5px; text-transform: uppercase; }

  /* ─── entity pane head ─── */
  .pane-head {
    display: flex; justify-content: space-between; align-items: center;
    gap: 12px; margin-bottom: 12px; flex-wrap: wrap;
  }
  .pane-tools { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .search {
    padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--surface); color: var(--text); font-size: 14px; min-width: 220px;
  }
  .chk { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 4px; }

  /* ─── buttons ─── */
  .btn {
    padding: 8px 14px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--surface); color: var(--text); font-size: 14px; cursor: pointer;
    font-weight: 500;
  }
  .btn:hover { background: rgba(0,0,0,.03); }
  .btn.primary { background: var(--accent-2); color: #fff; border-color: var(--accent-2); }
  .btn.primary:hover { filter: brightness(.95); }
  .btn.danger { background: var(--bad); color: #fff; border-color: var(--bad); }
  .btn.danger:hover { filter: brightness(.95); }

  /* ─── table ─── */
  .list-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .loading { padding: 24px; text-align: center; color: var(--muted); }
  .empty { padding: 40px 24px; text-align: center; color: var(--muted); }
  .error { padding: 20px; color: var(--bad); background: rgba(220,38,38,.05); border-radius: var(--radius); }

  table.grid { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.grid thead th {
    text-align: left; padding: 10px 12px; font-weight: 600; font-size: 12px;
    color: var(--muted); background: rgba(0,0,0,.02); border-bottom: 1px solid var(--border);
    text-transform: uppercase; letter-spacing: .3px; position: sticky; top: 0;
  }
  table.grid tbody td { padding: 10px 12px; border-bottom: 1px solid var(--border); }
  table.grid tbody tr { cursor: pointer; }
  table.grid tbody tr:hover { background: rgba(59,130,246,.05); }
  table.grid tr.row-inactive { opacity: .5; }
  table.grid tr.row-inactive td:first-child::before { content: '•'; color: var(--bad); margin-right: 4px; }

  /* ─── modal ─── */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,.5);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000; padding: 20px;
  }
  .modal {
    background: var(--surface); border-radius: var(--radius); max-width: 640px;
    width: 100%; max-height: 90vh; display: flex; flex-direction: column;
    box-shadow: 0 20px 50px rgba(0,0,0,.3);
  }
  .modal-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 16px 20px; border-bottom: 1px solid var(--border);
  }
  .modal-header h2 { margin: 0; font-size: 18px; }
  .modal-close {
    background: transparent; border: 0; font-size: 24px; color: var(--muted);
    cursor: pointer; line-height: 1; padding: 0 4px;
  }
  .modal-close:hover { color: var(--text); }
  .modal-body { padding: 20px; overflow-y: auto; flex: 1; }
  .modal-footer {
    display: flex; justify-content: flex-end; gap: 8px;
    padding: 14px 20px; border-top: 1px solid var(--border); background: rgba(0,0,0,.02);
  }

  /* ─── form ─── */
  .form { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .form-row { display: flex; flex-direction: column; gap: 4px; }
  .form-row-wide { grid-column: 1 / -1; }
  .form-label { font-size: 12px; color: var(--muted); font-weight: 500; letter-spacing: .3px; text-transform: uppercase; }
  .form-input {
    padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--surface); color: var(--text); font-size: 14px;
    font-family: inherit;
  }
  .form-input:focus { outline: 2px solid var(--accent-2); outline-offset: -1px; border-color: var(--accent-2); }
  .form-input.readonly, .form-input[readonly] { background: rgba(0,0,0,.03); color: var(--muted); }
  .form-input[disabled] { background: rgba(0,0,0,.03); color: var(--muted); }
  textarea.form-input { resize: vertical; min-height: 68px; }
  .form-hint { font-size: 11px; color: var(--muted); }
  @media (max-width: 500px) { .form { grid-template-columns: 1fr; } }

  /* ─── toast ─── */
  .toast {
    position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%) translateY(20px);
    padding: 10px 18px; border-radius: 8px; font-size: 13px; z-index: 2000;
    color: #fff; box-shadow: 0 4px 12px rgba(0,0,0,.3);
    opacity: 0; transition: opacity .2s, transform .2s;
  }
  .toast-show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast-ok  { background: var(--accent); }
  .toast-bad { background: var(--bad); }

  footer {
    text-align: center; padding: 16px; color: var(--muted);
    border-top: 1px solid var(--border); background: var(--surface);
    position: fixed; bottom: 0; left: 0; right: 0; font-size: 12px;
  }
  footer a { color: var(--muted); }

  @media (max-width: 600px) {
    main { padding: 16px 12px 80px; }
    .topbar { padding: 10px 12px; }
    .topbar .title { font-size: 14px; }
    .search { min-width: 100%; }
  }
</style>
