name: Deploy to Apps Script

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install clasp
        run: npm install -g @google/clasp@3.4.1

      - name: Write clasp credentials
        run: |
          mkdir -p ~
          printf '%s' '${{ secrets.CLASPRC_JSON }}' > ~/.clasprc.json
          # Guard against empty secret
          if [ ! -s ~/.clasprc.json ]; then
            echo "::error::CLASPRC_JSON secret is empty or not set"
            exit 1
          fi

      - name: Push to Apps Script
        run: clasp push --force
